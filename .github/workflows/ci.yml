name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Newer pushes to the same ref supersede in-flight runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# One job per package that can stand alone, each installing only what that package
# needs. The monorepo's independence claims are load-bearing, so they are enforced
# by what a job is *not* given rather than asserted in a README.
jobs:
  # The macOS app + the shared core it renders. Two packages, so two builds: the
  # core (library, CLI and smoke binary) and the SwiftUI app that depends on it.
  # The smoke binary then asserts the shared core logic (filters, prompt assembly,
  # PR-reference parsing, conflict prompts).
  swift-macos:
    name: Swift (macOS) · build + core smoke
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - run: swift --version
      - name: Build the shared core
        working-directory: packages/diplomat-core
        run: swift build
      - name: Build the macOS app
        working-directory: packages/diplomat-platform/macos
        run: swift build
      - name: Run shared-core smoke test
        working-directory: packages/diplomat-core
        run: swift run DiplomatCoreSmoke
      # Headless UI snapshot: renders the real two-column panel (seeded sessions,
      # devices, bans, audit feed) through ImageRenderer — a cheap whole-UI crash
      # guard that needs no gh auth and no display. A headless mode never persists
      # (settings writes are headless-guarded), so it can't touch any defaults.
      - name: Headless panel render
        working-directory: packages/diplomat-platform/macos
        run: |
          DIPLOMAT_RENDER=devices DIPLOMAT_RENDER_OUT="$RUNNER_TEMP/panel.png" \
            swift run Diplomat
          test -s "$RUNNER_TEMP/panel.png"
      # The shared-helper self-tests that a runner can host. All pure logic, and none
      # of them touches the runner's real state: OSA_TEST runs bare AppleScript
      # expressions (no `tell application`, so no Automation permission),
      # MESH_CMD_TEST is pinned to a scratch state dir and a non-checkout so it can
      # neither read a real mesh node nor start one, and ALLOCATOR_TEST shells no
      # installer and reads no ~/.claude.
      #
      # DIPLOMAT_TRACK_TEST and DIPLOMAT_SPAWN_FOCUS_TEST are the two that stay out,
      # and not by oversight: both drive real throwaway iTerm/Terminal windows and
      # need a granted "control <terminal>" Automation permission, which a headless
      # runner has no way to hold. They are run by hand from the installed .app.
      - name: Headless helper self-tests
        working-directory: packages/diplomat-platform/macos
        run: |
          DIPLOMAT_OSA_TEST=1 swift run Diplomat
          SZPONTNET_DIR="$RUNNER_TEMP/mesh" DIPLOMAT_SELF_REPO=/nonexistent \
            DIPLOMAT_MESH_CMD_TEST=1 swift run Diplomat
          DIPLOMAT_ALLOCATOR_TEST=1 swift run Diplomat

  # The shared core advertises "compiles on macOS *and* Linux". This guards that
  # invariant by building + running the diplomat-core package on Linux (the SwiftUI
  # app is a separate, macOS-only package and is intentionally not built here).
  swift-core-linux:
    name: Swift core (Linux) · cross-platform smoke
    runs-on: ubuntu-latest
    container: swift:6.0
    defaults:
      run:
        working-directory: packages/diplomat-core
    steps:
      - uses: actions/checkout@v7
      - run: swift --version
      - name: Build + run shared-core smoke test
        run: swift run DiplomatCoreSmoke
      # Build the static, portable diplomat-core CLI and hand it to the python-linux
      # job. The Python front-end shells out to this binary for every prompt, so
      # its pytest suite needs it present; building it here (once, in the Swift
      # container) keeps the Swift<->Python golden parity provable in CI.
      - name: Build diplomat-core CLI (static, portable)
        run: |
          swift build --product diplomat-core --static-swift-stdlib -c release
          bin="$(swift build --product diplomat-core --static-swift-stdlib -c release --show-bin-path)"
          mkdir -p artifact
          cp "$bin/diplomat-core" artifact/diplomat-core
      - name: Upload diplomat-core binary
        uses: actions/upload-artifact@v4
        with:
          name: diplomat-core-linux
          path: packages/diplomat-core/artifact/diplomat-core

  # The Linux (Qt6/PySide6) front-end. Offline, headless regression tests over the
  # same shared-core logic the GUI renders.
  python-linux:
    name: Python (Linux) · pytest
    runs-on: ubuntu-latest
    # The prompt tests shell out to diplomat-core; take the static binary the
    # swift-core-linux job built rather than installing a Swift toolchain here.
    needs: swift-core-linux
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: packages/diplomat-platform/linux/requirements.txt
      # Qt needs these shared libs present even under the offscreen platform plugin.
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r packages/diplomat-platform/linux/requirements.txt pytest
      - name: Download diplomat-core binary
        uses: actions/download-artifact@v4
        with:
          name: diplomat-core-linux
          path: core-bin
      - name: Make diplomat-core executable
        run: chmod +x core-bin/diplomat-core
      - name: Run tests (headless Qt)
        env:
          QT_QPA_PLATFORM: offscreen
          DIPLOMAT_CORE_BIN: ${{ github.workspace }}/core-bin/diplomat-core
        run: pytest packages/diplomat-platform/linux/tests -q
      # A checkout with no SzpontNet in it at all. `test_addon_optional.py` above
      # already blocks the import, but only this deletes the packages — so it is
      # the one that catches something reading a *file* out of the library's tree
      # rather than importing it. Destructive to the workspace, hence last.
      - name: The applet starts from a Diplomat-only tree
        env:
          QT_QPA_PLATFORM: offscreen
          DIPLOMAT_RENDER: panel
          DIPLOMAT_RENDER_OUT: ${{ runner.temp }}/no-szpontnet.png
        run: |
          rm -rf packages/szpontnet-core packages/szpontnet-spec
          cd packages/diplomat-platform/linux && python -m diplomat_app
          test -s "$DIPLOMAT_RENDER_OUT"

  # SzpontNet, on its own terms. Deliberately installs nothing but the library and
  # pytest: no Qt, no diplomat-core binary, no Diplomat on the import path. If the
  # node ever grows a dependency on the application that ships it in this
  # repository, or on anything outside the standard library, this job is where that
  # surfaces — as an ImportError rather than as a discovery six months later.
  szpontnet:
    name: SzpontNet · library + conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install the library (with the trust extra) and pytest
        run: pip install -e './packages/szpontnet-core[trust]' pytest
      - name: Unit + host-seam tests
        run: pytest packages/szpontnet-core/tests -q -m 'not tor_e2e'
      # The onion path against a real tor daemon — here the simulated one, which
      # needs no network and no `tor` installed but still runs every line of the
      # transport: a spawned daemon, a torrc it parses, SOCKS5 on a socket, and whole
      # node processes that can only reach each other over an onion. The same tests
      # run against the live Tor network in tor-e2e.yml.
      - name: Tor transport end-to-end (simulated onion network)
        run: pytest packages/szpontnet-core/tests/test_tor_e2e.py -q
      # The tester's own codec and placement oracle, derived from the spec rather
      # than from the node — if this is wrong every verdict below is meaningless.
      - name: Conformance tester self-test
        working-directory: packages/szpontnet-spec/conformance
        run: python -m szpont --selftest
      # The reference node as an opaque subprocess, over real multicast + TCP on
      # loopback. Nothing here reads the node's source, so this is the check that
      # the spec in docs/ is implementable from the spec alone — and the one that
      # catches a MUST the unit tests are shaped around rather than against.
      - name: Conformance run against the reference node
        working-directory: packages/szpontnet-spec/conformance
        run: python -m szpont --node-cmd "python adapters/reference.py" --no-color

  # The device-allocator MCP server + daemon. Self-contained Node tests that drive
  # the allocator over its unix socket against a synthetic device pool (DA_FAKE_DEVICES),
  # so they need no real simulators/emulators and run on Linux.
  node-device-allocator:
    name: Node (device allocator) · daemon + MCP tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/device-allocator
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: packages/device-allocator/package-lock.json
      # Strict `npm ci` only: the old `|| npm install` fallback silently degraded a
      # broken/stale lockfile into a non-reproducible install.
      - name: Install dependencies
        run: npm ci
      # `npm test` discovers test/*.mjs from disk rather than naming them, so this
      # is one step instead of a list CI has to keep in step with package.json.
      # Those were two hand-written lists of the same files and they had drifted
      # apart in both directions — a test can now only be skipped by not existing.
      # The runner prints a banner per file, so a failure still names itself.
      - name: Daemon, MCP, installer drift, agent-kill, repair and wipe tests
        run: npm test
