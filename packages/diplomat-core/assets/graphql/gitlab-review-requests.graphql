# GitLab twin of review-requests.graphql: merge requests that request MY review.
# Review requests, approvals, requested changes and reviews left without either ("left
# review comments") exist only as system notes, so activity notes carry those times and
# comments are the rest. A request older than the activity window reads as made at its
# oldest note (the MR's creation for an empty window), so my response inside it answers
# it. An author past a full member page is looked up in REST members/all.
query($path: ID!, $reviewer: String!, $withFiles: Boolean!) {
  project(fullPath: $path) {
    projectMembers(first: 100, relations: [DIRECT, INHERITED, INVITED_GROUPS, SHARED_INTO_ANCESTORS]) {
      pageInfo { hasNextPage }
      nodes { user { username } }
    }
    mergeRequests(state: opened, reviewerUsername: $reviewer, first: 30, sort: UPDATED_DESC) {
      nodes {
        iid title webUrl diffHeadSha createdAt
        author { id username }
        diffStats @include(if: $withFiles) { path }
        activity: notes(last: 100, filter: ONLY_ACTIVITY) { nodes { author { username } createdAt body } }
        comments: notes(last: 20, filter: ONLY_COMMENTS) { nodes { author { username } createdAt } }
      }
    }
  }
}
