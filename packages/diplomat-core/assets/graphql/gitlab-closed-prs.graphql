# GitLab twin of closed-prs.graphql; merged and closed are separate states here.
query($path: ID!) {
  project(fullPath: $path) {
    merged: mergeRequests(state: merged, first: 50, sort: UPDATED_DESC) { nodes { iid } }
    closed: mergeRequests(state: closed, first: 50, sort: UPDATED_DESC) { nodes { iid } }
  }
}
