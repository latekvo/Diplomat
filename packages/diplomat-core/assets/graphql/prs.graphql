# Open PRs, newest first, 25 a page ($after: the previous page's endCursor); the callers
# read 4 pages, the 100 newest. One page of 100 with these files and threads runs past
# GitHub's ~10s GraphQL limit and fails with a 504.
query($owner: String!, $name: String!, $after: String) {
  repository(owner: $owner, name: $name) {
    pullRequests(states: OPEN, first: 25, after: $after, orderBy: {field: CREATED_AT, direction: DESC}) {
      pageInfo { hasNextPage endCursor }
      nodes {
        number title url isDraft createdAt reviewDecision mergeable
        author { login }
        files(first: 100) { nodes { path } }
        timelineItems(itemTypes: [READY_FOR_REVIEW_EVENT], last: 1) {
          nodes { __typename ... on ReadyForReviewEvent { createdAt } }
        }
        reviewThreads(first: 50) {
          nodes {
            isResolved viewerCanResolve
            comments(last: 1) { totalCount nodes { author { login } body } }
          }
        }
      }
    }
  }
}
