# My reviews on one PR, for the check a review run gets when it retires
# (ReviewAudit.swift / reviewaudit.py). A PENDING review is listed only to its
# author, which is the point: nobody else can see one. A comment's body says
# whether an agent wrote it (the Diplomat attribution tag opens it). A comment with
# no replyTo opened a thread, so threads spread over several submitted reviews are findings
# posted one at a time rather than inside one review.
query ($owner: String!, $name: String!, $number: Int!, $me: String!) {
  repository(owner: $owner, name: $name) {
    pullRequest(number: $number) {
      author { login }
      reviews(last: 30, author: $me) {
        nodes {
          state
          createdAt
          submittedAt
          comments(first: 50) { nodes { body createdAt replyTo { id } } }
        }
      }
    }
  }
}
