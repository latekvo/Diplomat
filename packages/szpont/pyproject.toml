[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "szpont"
version = "0.23.0"
description = "Install-and-run for Diplomat (Szpont Yon): fetches the checkout, builds it, and starts the applet"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ignacy Łątka" }]
keywords = ["diplomat", "szpont", "szpontnet", "launcher", "menu-bar", "tray"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Installation/Setup",
]
# Empty, and it has to stay empty: this is what runs before Diplomat exists, on
# whatever interpreter `pip` was on, so a dependency here is one the user has to
# resolve to get anything at all.
dependencies = []

[project.scripts]
# The module is `szpont_launcher`, not `szpont`, so that the import name stays
# free for the conformance tester.
szpont = "szpont_launcher:main"

[project.urls]
Homepage = "https://github.com/latekvo/Diplomat"
Source = "https://github.com/latekvo/Diplomat/tree/main/packages/szpont"
Issues = "https://github.com/latekvo/Diplomat/issues"

[tool.setuptools]
py-modules = ["szpont_launcher"]
